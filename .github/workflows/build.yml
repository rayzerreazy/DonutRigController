```yaml
name: Build DonutRigController

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: DonutRigController
          path: build/libs/*.jar

### Step 4 — Save it

1. Click **Commit changes**.
2. Leave the branch as `main`.
3. Confirm the commit.

### Step 5 — Watch the build

Go to the **Actions** tab.

You should see:

`Build DonutRigController`

Click it to see the build progress.

- 🟡 Yellow = Building.
- 🟢 Green = Success.
- 🔴 Red = Error.

**One thing:** Our project hasn't been compiled yet, so we'll use the first build to identify and fix any errors.

